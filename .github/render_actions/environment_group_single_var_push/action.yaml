name: "Single ENV var push to Render environment group"
description: "Uses Render's API to push a single environment variable to a dedicated environment group"
inputs:
  envKey:
    description: "The env key to set the value for"
    required: true
  envVal:
    description: "The env value for the env key"
    required: true
  envGrpId:
    description: "The environment group id as found on the Render dashboard. Provide this by secure means!"
    required: false
    default: ${{ secrets.RENDER_ENV_GROUP_ID }}
runs:
  using: composite
  steps:
    - name: "Push ${{ inputs.envKey }} value to env group on render"
      id: "PushSingleEnvToEnvGrpOnRender"
      shell: bash
      run: |
        curl --request PUT \
          --url https://api.render.com/v1/env-groups/${{ inputs.envGrpId }}/env-vars/${{ inputs.envKey }} \
          --header 'accept: application/json' \
          --header 'authorization: Bearer ${{ secrets.RENDER_API_KEY }}' \
          --header 'content-type: application/json'
          --data '{"value":"${{ inputs.envVal }}"}'

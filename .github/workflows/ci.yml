name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One run per branch. Master builds finish; superseded PR pushes are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  backend:
    name: tapes-hub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tapes-hub
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test and integration-test
        run: ./gradlew build --continue --no-daemon

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: tapes-hub-test-reports_${{ github.run_id }}
          path: |
            tapes-hub/build/reports/tests/
            tapes-hub/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

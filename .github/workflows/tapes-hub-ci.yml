name: tapes-hub CI

# Path-filtered so a web-portal-only change does not spend time on tapes-hub (Gradle build or tests).
on:
  push:
    branches: [master]
    paths:
      - 'tapes-hub/**'
      - '.github/workflows/tapes-hub*.yml'
  pull_request:
    branches: [master]
    paths:
      - 'tapes-hub/**'
      - '.github/workflows/tapes-hub*.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  # configuration needed to publish reports with mikepenz/action-junit-report
  checks: write
  pull-requests: write

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tapes-hub
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test and integration-test
        run: |
          ./gradlew wrapper --distribution-type bin;
          ./gradlew build --continue --no-daemon

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: tapes-hub-test-reports_${{ github.run_id }}
          path: |
            tapes-hub/build/reports/tests/
            tapes-hub/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: tapes-hub/build/test-results/**/*.xml
          check_name: tapes-hub test results
          detailed_summary: true
          include_passed: true
          # when it's a fork PR only annotate -> no check runs needed
          annotate_only: ${{ github.event.pull_request.head.repo.fork == true }}

  image:
    name: container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Only that it builds. The Dockerfile has its own ways to break that a Gradle build cannot
      # catch, and finding that out at release time is too late.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: tapes-hub
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

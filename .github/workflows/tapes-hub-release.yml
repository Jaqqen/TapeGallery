name: tapes-hub release

on:
  push:
    tags: ['tapes-hub-v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish image to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tapes-hub-v1.2.3 -> 1.2.3. The owner is lowercased because ghcr.io rejects an image
      # reference with uppercase in it.
      - name: Derive image reference
        id: owner_and_version
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#tapes-hub-v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tapes-hub
          push: true
          tags: |
            ghcr.io/${{ steps.owner_and_version.outputs.owner }}/tapes-hub:${{ steps.owner_and_version.outputs.version }}
            ghcr.io/${{ steps.owner_and_version.outputs.owner }}/tapes-hub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

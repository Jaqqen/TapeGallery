name: web-portal release

# Tag to ship: web-portal-v1.2.3. See tapes-hub-release.yml for why tags live in their own file.
on:
  push:
    tags: ['web-portal-v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: build the bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-portal
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-portal/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # TODO: this only retains the artifact. Replace with the deploy to the chosen static host once that decision is made, and drop the upload.
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-portal-dist_${{ github.ref_name }}
          path: web-portal/dist/
          retention-days: 90
          if-no-files-found: error

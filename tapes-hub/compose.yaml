# Dev database – run on startup through application-dev.yaml
services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?missing, copy tapes-hub/.env.example to tapes-hub/.env}
      POSTGRES_USER: ${POSTGRES_USER:?missing, copy tapes-hub/.env.example to tapes-hub/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing, copy tapes-hub/.env.example to tapes-hub/.env}
    ports:
      - '5432:5432'
    volumes:
      - 'tapeshub-postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}' ]
      interval: 5s
      timeout: 5s
      retries: 10

# docker volume
volumes:
  tapeshub-postgres-data:

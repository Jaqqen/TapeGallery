# $schema: https://render.com/schema/render.yaml.json
# Render Blueprint for tapes-hub.
#
# The image is the release artifact: CI publishes it to ghcr.io and Render pulls it.
# The GHCR package must be public or Render needs registry credentials.
#
# To rollback change the tag: point `image.url` at ghcr.io/jaqqen/tapes-hub:<older version>.
projects:
  - name: TapeGallery Project
    environments:
      - name: dev
        services:
          - name: tapes-hub-dev
            type: web
            runtime: image
            plan: free
            region: ohio
            autoDeploy: false
            image:
              url: ghcr.io/jaqqen/tapes-hub:latest
            healthCheckPath: /actuator/health/readiness
            envVars:
              # Defined on Render dashboard but provisioned by GitHub workflow
              - fromGroup: tapes-hub-env-gp
